<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web File Server</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <div class="toast-container" id="toastContainer"></div>

    <div class="container glass-panel">
        <header>
            <div class="header-titles">
                <div style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                    <h1>My Files</h1>
                    <button class="btn icon-btn" id="refreshBtn" title="Refresh">🔄</button>
                    <button class="btn icon-btn" id="viewToggleBtn" title="Toggle List/Grid View" onclick="toggleViewMode()">▦ Grid</button>
                </div>
                <p id="systemInfo" class="system-info">Loading device info...</p>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap;">
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="searchInput" class="search-input" placeholder="Search files... (/)" oninput="handleSearch()" />
                    <button id="clearSearchBtn" class="clear-search-btn" onclick="clearSearch()" style="display: none;">✕</button>
                </div>
                <button class="btn icon-btn" id="selectAllBtn" onclick="toggleSelectAllBtn()" title="Select All (Ctrl+A / Cmd+A)">☑ Select All</button>
                <button class="btn icon-btn" onclick="openMkdirModal()" title="New Folder">📁 New Folder</button>

                <div class="upload-btn-wrapper">
                    <button class="btn primary-btn">Upload File</button>
                    <input type="file" id="fileInput" name="myfile" multiple />
                </div>
            </div>
        </header>

        <div class="upload-progress-container" id="uploadProgressContainer">
            <div class="upload-text">Uploading <span id="uploadFilename">...</span></div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="uploadProgressBar"></div>
            </div>
        </div>

        <div class="file-list-container">
            <div id="breadcrumb" class="breadcrumb" style="padding: 1rem; border-bottom: 1px solid var(--panel-border); font-weight: 500;">
                <span>Home</span>
            </div>
            <table class="file-list">
                <thead>
                    <tr>
                        <th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAllCheckbox" class="custom-checkbox" onclick="toggleSelectAll(this)" title="Select All"></th>
                        <th id="thName" class="sortable" onclick="handleSort('name')">Name</th>
                        <th id="thSize" class="sortable" onclick="handleSort('size')">Size</th>
                        <th id="thTime" class="sortable" onclick="handleSort('time')">Modified</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="fileListBody">
                    <!-- Files will be dynamically populated here -->
                </tbody>
            </table>
            <div id="fileGridContainer" class="file-grid" style="display: none;"></div>
            <div class="empty-state" id="emptyState" style="display: none;">
                <p>No files found. Upload something!</p>
            </div>
        </div>
    </div>
    <div id="dragOverlay" class="drag-overlay" style="display: none;">
        <div class="drag-overlay-content">
            <span style="font-size: 3rem;">📥</span>
            <h2>Drop files here to upload</h2>
        </div>
    </div>

    <!-- Media Preview Modal -->
    <div id="previewModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel" style="max-width: 90vw; max-height: 90vh;">
            <div class="modal-header">
                <div style="display: flex; align-items: center; gap: 0.75rem;">
                    <h3 id="previewTitle">File Preview</h3>
                    <span id="slideshowCounter" class="slideshow-counter" style="display: none;">1 / 1</span>
                </div>
                <div class="modal-actions" style="display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;">
                    <div id="slideshowControls" class="slideshow-controls" style="display: none;">
                        <button class="btn icon-btn" onclick="prevImage()" title="Previous Image (←)">◀</button>
                        <select id="slideshowSpeed" class="glass-input" style="padding: 0.3rem; margin: 0 0.2rem; font-size: 0.8rem; background: rgba(255,255,255,0.1); color: white; cursor: pointer; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;" title="Slideshow Speed" onchange="updateSlideshowSpeed()">
                            <option value="3000" style="color: black;">3s</option>
                            <option value="5000" style="color: black;" selected>5s</option>
                            <option value="10000" style="color: black;">10s</option>
                            <option value="20000" style="color: black;">20s</option>
                        </select>
                        <button class="btn icon-btn" id="slideshowPlayBtn" onclick="toggleSlideshowPlay()" title="Auto Play / Pause (Space)">▶ Play</button>
                        <button class="btn icon-btn" onclick="nextImage()" title="Next Image (→)">▶</button>
                        <button class="btn icon-btn" onclick="toggleFullscreenPreview()" title="Fullscreen (F)">⛶</button>
                        <button class="btn icon-btn" onclick="quickDeleteCurrentImage()" title="Quick Delete & Next Image (Delete)" style="background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3);">🗑️</button>
                    </div>
                    <a id="previewNewTab" href="#" target="_blank" class="btn icon-btn" title="Open in new tab">↗</a>
                    <button class="btn icon-btn" onclick="closePreview()" title="Close (Esc)">✕</button>
                </div>
            </div>
            <div class="modal-body" id="previewBody" style="position: relative;"></div>
            <div id="exifOverlay" class="exif-overlay" style="display: none;">
                <div id="exifLocation" class="exif-item"><span class="exif-icon">📍</span> <span class="exif-text"></span></div>
                <div id="exifDate" class="exif-item"><span class="exif-icon">🕒</span> <span class="exif-text"></span></div>
            </div>
        </div>
    </div>

    <!-- Move File Modal -->
    <div id="moveModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel" style="max-width: 500px;">
            <div class="modal-header">
                <h3>Move File</h3>
                <button class="btn icon-btn" onclick="closeMoveModal()" title="Close">✕</button>
            </div>
            <div class="modal-body" style="flex-direction: column; align-items: stretch; gap: 1rem;">
                <p style="font-size: 0.9rem; color: var(--text-muted);">Moving <b id="moveFileName" style="color: var(--text-color);">...</b></p>
                <div class="breadcrumb" id="moveBreadcrumb" style="font-size: 0.9rem; background: rgba(0,0,0,0.2); padding: 0.5rem 0.8rem; border-radius: 8px;">
                    Target: <span>Home</span>
                </div>
                <div id="moveFolderList" class="move-folder-list" style="max-height: 250px; overflow-y: auto; border: 1px solid var(--panel-border); border-radius: 8px;"></div>
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem;">
                    <button class="btn" onclick="closeMoveModal()">Cancel</button>
                    <button id="confirmMoveBtn" class="btn primary-btn" onclick="confirmMove()">📦 Move Here</button>
                </div>
            </div>
        </div>
    </div>

    <!-- New Folder Modal -->
    <div id="mkdirModal" class="modal-overlay" style="display: none;">
        <div class="modal-content glass-panel" style="max-width: 400px;">
            <div class="modal-header">
                <h3>Create New Folder</h3>
                <button class="btn icon-btn" onclick="closeMkdirModal()" title="Close">✕</button>
            </div>
            <div class="modal-body" style="flex-direction: column; align-items: stretch; gap: 1rem;">
                <input type="text" id="newFolderName" class="text-input" placeholder="Folder Name" onkeyup="if(event.key==='Enter') createFolder()" />
                <div style="display: flex; justify-content: flex-end; gap: 0.5rem;">
                    <button class="btn" onclick="closeMkdirModal()">Cancel</button>
                    <button class="btn primary-btn" onclick="createFolder()">Create</button>
                </div>
            </div>
        </div>
    </div>



    <!-- Batch Action Floating Toolbar -->
    <div id="batchToolbar" class="batch-toolbar glass-panel" style="display: none;">
        <div class="batch-info">
            <span id="batchCount">0</span> selected
        </div>
        <div class="batch-buttons">
            <button class="btn-action move-btn" onclick="openBatchMoveModal()">📦 Move Selected</button>
            <button class="btn-action delete-btn" onclick="batchDeleteSelected()">🗑️ Delete Selected</button>
            <button class="btn icon-btn" onclick="clearSelection()" title="Clear Selection">✕</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
